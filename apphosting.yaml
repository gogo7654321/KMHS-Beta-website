# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1

# No env/secrets needed for Firebase config: App Hosting automatically injects
# the web app config (FIREBASE_WEBAPP_CONFIG) at build and runtime, and the app
# initializes from it. src/firebase/config.ts reads that as a fallback for
# server-side code; local dev uses .env.local.
